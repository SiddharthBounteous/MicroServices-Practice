spring.application.name=api-gateway
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

#order-service configuration
spring.cloud.gateway.server.webmvc.routes[0].id=post-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://POST-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/posts/**

#analytics-service configuration
spring.cloud.gateway.server.webmvc.routes[1].id=interaction-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://INTERACTION-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/interactions/**

#auth-service configuration
spring.cloud.gateway.server.webmvc.routes[2].id=auth-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/auth/**

#user-service configuration
spring.cloud.gateway.server.webmvc.routes[3].id=user-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/users/**

app.jwt.secret=${JWT_SECRET}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins="http://localhost:4200"
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedCredentials=true
